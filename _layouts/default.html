<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <!-- <link rel="stylesheet"
        href="{{ '/assets/css/override.css?v=1' | append: site.github.build_revision | relative_url }}"> -->
    {% include head-custom.html %}

    {% seo %}
   <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose'
      });

      function renderMermaidBlocks() {
        // Plain kramdown output puts the language class on <code>; a Rouge-highlighted
        // build (e.g. GitHub Pages) instead wraps the block in <div class="language-mermaid">.
        const blocks = document.querySelectorAll(
          'pre code.language-mermaid, div.language-mermaid code'
        );
        const seen = new Set();

        blocks.forEach((node) => {
          const container = node.closest('div.language-mermaid') || node.closest('pre');
          if (!container || seen.has(container)) return;
          seen.add(container);

          const text = node.textContent.trim();
          if (!text) return;

          const wrapper = document.createElement('div');
          wrapper.className = 'mermaid';
          wrapper.textContent = text;

          container.replaceWith(wrapper);
        });

        mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderMermaidBlocks);
      } else {
        renderMermaidBlocks();
      }
    </script>
</head>

<body>

    <header>
        <div class="container">
            <a id="a-title" href="{{ '/' | relative_url }}">
                <h1>{{ site.title | default: site.github.repository_name }}</h1>
            </a>
            <h2>{{ site.description | default: site.github.project_tagline }}</h2>

            <section id="downloads">
                {% if site.show_downloads %}
                <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
                <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
                {% endif %}
                <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on
                    GitHub</a>
            </section>
        </div>
    </header>

    <div class="container">
        <section id="main_content">
            {{ content }}
        </section>
    </div>
</body>

</html>
